name: Update A-share report and deploy site

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This is 07:40 Asia/Shanghai, Monday-Friday.
    - cron: "40 23 * * 0-4"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
      - ".nojekyll"

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest report
        if: github.event_name != 'push'
        run: python scripts/daily_report.py

      - name: Print report summary
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/report-latest.json").read_text(encoding="utf-8"))
          summary = report["summary"]
          warnings = report.get("data_quality", {}).get("warnings", [])
          print(f"Report date: {report['report_date']}")
          print(f"Market rows: {summary['valid_count']}")
          print(f"Strong stocks: {summary['selected_count']}")
          print(f"Data source: {report['data_source']}")
          print(f"Warnings: {len(warnings)}")
          for warning in warnings:
              print(f"- {warning}")
          PY

      - name: Commit updated report
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No report changes to commit."
          else
            git add data/report-latest.json data/history.json data/reports
            git commit -m "chore: update A-share report"
            git push
          fi

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          if [ -d data ]; then
            cp -R data/* _site/data/
          fi
          touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add _pages origin/gh-pages
            cd _pages
            git checkout -B gh-pages
          else
            git worktree add --detach _pages
            cd _pages
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../_site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No Pages changes to deploy."
          else
            git commit -m "deploy: update GitHub Pages"
            git push origin gh-pages
          fi
